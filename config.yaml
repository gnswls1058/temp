llm_validation:
  provider: "anthropic"
  model: "claude-sonnet-5"
  api_key: "${ANTHROPIC_API_KEY}"
  max_tokens: 4096
  temperature: 0.0
  context_per_term: 2
  batch_size: 24
  max_retries: 3
  retry_backoff_seconds: 2.0
  # 대표 context 선택 시 서로 다른 page/pattern에서 뽑기 위한 옵션
  diversify_by_page: true
  max_contexts_per_page: 2
  # dry_run: true 이면 LLM 호출 없이 UNKNOWN 으로 기록 (파이프라인 점검용)
  dry_run: false

relation_policy:
  # LLM confidence 별 활성화 정책 (§39)
  # 자동 ACTIVE 는 좁게 잡는다. 잘못된 유의어 하나가 검색을 광범위하게 오염시키는
  # 비용이, 유의어 하나를 놓치는 비용보다 크다. recall 은 REVIEW 에서 회수한다.
  active_relation_types: ["SAME_ENTITY", "EXACT_ALIAS", "ABBREVIATION"]
  # 양방향 치환이 안전하다고 판정된 관계만 자동 승인한다.
  require_bidirectional_for_active: true
  high_confidence_status: "ACTIVE"
  medium_confidence_status: "REVIEW"
  low_confidence_status: "REJECTED"
  # RELATED 는 저장하되 기본 확장에 쓰지 않음 -> REVIEW 로 보관
  related_status: "REVIEW"
  never_expand_types: ["RELATED", "ANTONYM", "UNRELATED", "UNKNOWN"]
  # ENTITY 는 동일 엔티티 관계만 확장 허용 (§44)
  entity_expandable_types: ["SAME_ENTITY", "EXACT_ALIAS", "ALIAS", "ABBREVIATION"]
  concept_expandable_types: ["EXACT_ALIAS", "SYNONYM", "NEAR_SYNONYM", "ABBREVIATION"]
  # Alias 전이 자동 생성 금지 (§47)
  enable_alias_transitivity: false

logging:
  level: "INFO"
  file: "./data/output/pipeline.log"
